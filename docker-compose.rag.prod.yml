# Cinco Wiki — GraphRAG (prod VPS). Même stack que docker-compose.rag.yml,
# avec bind 127.0.0.1 + les 3 secrets ci-dessous.
#
#   cp .env.rag.prod.example .env.rag.prod
#   docker compose -f docker-compose.rag.prod.yml --env-file .env.rag.prod up -d
#
# Env (seulement) :
#   QDRANT_API_KEY   — auth Qdrant (laisser vide pour désactiver l'auth)
#   NEO4J_USER       — défaut neo4j
#   NEO4J_PASSWORD   — mot de passe Neo4j
#
# Ports (tous bindés sur 127.0.0.1 — accès local / reverse proxy / SSH tunnel) :
#
#   6333  Qdrant REST HTTP
#         → Lambda / backend : QDRANT_URL=http://127.0.0.1:6333
#         → ou Nginx/Caddy TLS public → proxy_pass http://127.0.0.1:6333
#         → header api-key si QDRANT_API_KEY est défini
#         → dashboard : http://127.0.0.1:6333/dashboard
#
#   6334  Qdrant gRPC (optionnel — unused by default JS client)
#
#   7474  Neo4j Browser (UI admin)
#         → http://127.0.0.1:7474  (SSH tunnel si remote : ssh -L 7474:127.0.0.1:7474 vps)
#         → login : NEO4J_USER / NEO4J_PASSWORD
#
#   7687  Neo4j Bolt (driver Cypher — packages/backend)
#         → NEO4J_URI=bolt://127.0.0.1:7687
#         → ne jamais publier ce port sur 0.0.0.0 / Internet
#
# TLS public : reverse proxy → 127.0.0.1:6333 seulement. Pas d'exposition 7687.

services:
  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333" # REST — QDRANT_URL / reverse proxy TLS
    volumes:
      - qdrant_wiki_prod_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474" # Browser UI — http://127.0.0.1:7474
      - "7687:7687" # Bolt — NEO4J_URI=bolt://127.0.0.1:7687
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_wiki_prod_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  qdrant_wiki_prod_data:
  neo4j_wiki_prod_data:
